name = "videostats"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Observability configuration
[observability]
enabled = true
head_sampling_rate = 1  # 100% of requests

[observability.logs]
enabled = true

[observability.traces]
enabled = true

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "videostats-prod-db"
database_id = "879c076d-0ae5-4e8c-92d9-20e69de4304f"

# Uncomment to enable local development with D1
# [env.dev]
# [[env.dev.d1_databases]]
# binding = "DB"
# database_name = "videostats-db"
# database_id = "local"
